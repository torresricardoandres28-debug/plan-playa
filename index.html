<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E5BD8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plan Playa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Plan Playa</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#101C26; --muted:#5B6B79; --line:#D5DCE3;
  --accent:#1E5BD8; --accent-ink:#FFFFFF; --good:#17825A; --good-bg:#DDF3E8; --mid-bg:#FBEBC8; --low-bg:#E3E8ED; --gold:#B7791F; --gold-bg:#FBEBC8;
  --cp:#2F6BDB;--cc:#C77A0B;--cv:#1E8A52;--cf:#C2417C;--cg:#7A8794;
  --display:'Avenir Next Condensed','Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0C141C; --surface:#152230; --ink:#E8EEF3; --muted:#93A4B3; --line:#263646;
  --accent:#6FA0FF; --accent-ink:#0C141C; --good:#4CC38A; --good-bg:#14372B; --mid-bg:#3B2F12; --low-bg:#1E2D3B; --gold:#F0C26B; --gold-bg:#3B2F12;
  --cp:#7FA8FF;--cc:#F0B454;--cv:#5CCB8E;--cf:#F08AB8;--cg:#9AA7B4}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 150px}
h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0}
h2{font-size:28px;margin-block:22px 10px}
h3{font-size:21px;margin-block:0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hero{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.count{font-family:var(--display);font-size:64px;line-height:.9;font-weight:700;font-variant-numeric:tabular-nums}
.count small{font-size:20px;font-weight:600;color:var(--muted);margin-left:6px}
.nav{display:flex;align-items:center;gap:6px}
.nav button{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;font-size:18px}
.nav .today{width:auto;padding-inline:14px;font-size:14px}
.daytitle{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.05}
.bar{height:10px;border-radius:6px;background:var(--low-bg);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .2s}
.bar.ok>i{background:var(--good)}
.score{font-family:var(--display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left}
.check:first-child{border-top:0}
.box{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-size:16px;color:transparent;margin-top:1px}
.check[aria-checked="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
.check[aria-checked="true"] .t{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.t{font-weight:600}
.sub{display:block;font-size:13px;color:var(--muted);font-weight:400}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--low-bg);color:var(--muted);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.tag.pr{background:var(--gold-bg);color:var(--gold)}
input[type=number],input[type=text],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:center;padding-block:2px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:22px;color:var(--muted);line-height:1}
details[open]>summary::after{content:"–"}

/* registro de series */
.ex{padding:12px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exn{font-weight:600}
.prev{font-size:12px;color:var(--muted);margin-top:2px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center;margin-top:8px}
.set .sn{font-family:var(--display);font-size:20px;color:var(--muted);text-align:center}
.set input{text-align:center;font-weight:600;padding-block:10px}
.dn{height:44px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:20px;color:var(--muted)}
.set.on .dn{background:var(--good);border-color:var(--good);color:#fff}
.set.on input{background:var(--good-bg);border-color:var(--good)}
.lbls{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;font-size:11px;color:var(--muted);text-align:center;margin-top:6px;letter-spacing:.05em;text-transform:uppercase}
.mini{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--muted);margin-top:8px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.sum b{display:block;font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.sum span{font-size:12px;color:var(--muted)}

/* cronómetro */
#timer{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:696px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#timer.on{display:flex}
#timer .tm{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;flex:1}
#timer small{display:block;font-family:var(--body);font-size:11px;font-weight:500;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
#timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:600}
#timer.done{background:var(--good);color:#fff}

/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:11px;text-align:center;color:var(--muted);font-weight:600}
.cell{border:1px solid var(--line);border-radius:10px;min-height:62px;padding:6px 4px;background:var(--surface);text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.cell b{font-family:var(--display);font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
.cell span{font-size:10px;line-height:1.1;color:var(--muted);font-weight:500}
.cell.out{opacity:.35;pointer-events:none}
.cell.g{background:var(--good-bg);border-color:var(--good)}
.cell.m{background:var(--mid-bg)}
.cell.l{background:var(--low-bg)}
.cell.now{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
ul.plain{margin:0;padding-left:18px} ul.plain li{margin-bottom:5px}
.rule{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0}
.rule .no{font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.macro{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.macro b{display:block;font-family:var(--display);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.macro span{font-size:12px;color:var(--muted)}
.meas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.meas label{font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:3px}
.seg{display:flex;background:var(--low-bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.install{background:var(--gold-bg);border-color:var(--gold);color:var(--ink)}
/* modo gimnasio */
.btn.big{width:100%;padding:16px;font-size:17px;margin:10px 0 6px;border-radius:12px}
.exrowb{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;text-align:left}
.exrowb:first-of-type{border-top:0}
.exrowb .ct{font-family:var(--display);font-size:22px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.exrowb .ct.ok{color:var(--good)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0;font-size:15px}
.dots{display:flex;gap:5px;margin:10px 0 14px}
.dot{flex:1;height:6px;border-radius:4px;background:var(--low-bg)}
.dot.cur{background:var(--accent)}
.dot.ok{background:var(--good)}
.ftitle{font-family:var(--display);font-size:38px;line-height:1;font-weight:700;margin:2px 0 6px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.sc.on{border-color:var(--good);background:var(--good-bg)}
.sch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.sch b{font-family:var(--display);font-size:22px}
.st2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;grid-template-areas:"l l l" "m i p";gap:6px;align-items:center}
.st .lb{grid-area:l;font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:center}
.st .m{grid-area:m}.st .p{grid-area:p}.st input{grid-area:i;text-align:center;font-size:22px;font-weight:700;padding:10px 2px;font-family:var(--display)}
.st button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:24px;line-height:1;color:var(--ink)}
.dnb{width:100%;margin-top:10px;height:50px;border-radius:12px;border:2px solid var(--accent);background:none;color:var(--accent);font-weight:700;font-size:16px}
.sc.on .dnb{background:var(--good);border-color:var(--good);color:#fff}
.fnav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.fnav div{display:flex;gap:10px;max-width:720px;margin:0 auto}
.fnav button{flex:1;height:50px;border-radius:12px;font-weight:700;font-size:16px;border:1px solid var(--line);background:var(--bg)}
.fnav button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:1.4}
body.focus .tabs{display:none}
.memo{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:6px 0;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-top:2px}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hset{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 40px;gap:8px;align-items:center;margin-top:6px}
.hset .sn{text-align:center;color:var(--muted);font-family:var(--display);font-size:18px}
.hset input{text-align:center;padding-block:8px}
.xbtn{height:38px;border:1px solid var(--line);background:none;border-radius:8px;color:var(--muted);font-size:16px}
.hday{padding:12px 16px}
.hex{padding:10px 0;border-top:1px solid var(--line)}
.hex:first-of-type{border-top:0}.sg{margin:10px 0 2px;padding:9px 12px;border-radius:10px;background:var(--low-bg);border-left:4px solid var(--accent);font-size:14px;font-weight:600}
.chips button{min-height:44px}
.mini{min-height:44px;padding:10px 14px}
.xbtn{height:44px;min-width:44px}
.okbar{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--good-bg);border:1px solid var(--good);font-weight:600}
.fnav button.go.pulse{animation:pulse 1.1s ease-in-out 4}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.fnav button.go.pulse{animation:none}}
.hint ol{margin:6px 0 0;padding-left:20px}
.fi{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.fin{display:flex;flex-direction:column;min-width:0;gap:2px}
.figr{display:flex;align-items:center;gap:8px}
.fg{width:80px;text-align:center;padding:8px 4px}
.picker{margin-top:12px;padding-top:12px;border-top:2px solid var(--accent)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px;text-align:left;min-height:48px}
.frow:first-child{border-top:0}
.stackbar{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:10px 0 8px;background:var(--low-bg)}
.stackbar i{display:block;height:100%}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:14px;border:1px solid var(--line);color:var(--muted)}
.bchip.ok{color:var(--ink)}
.bchip i,.dotc{display:inline-block;width:9px;height:9px;border-radius:50%}
.dotc{margin-right:8px}
.fgrp{border-top:1px solid var(--line)}
.fgrp:first-child{border-top:0}
.fgrp>summary{padding:13px 2px;min-height:48px}
.fgrp .frow{padding-left:14px}
.anr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.okc{color:var(--good)}
.warnc{color:var(--gold)}
details.an{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.an>summary{min-height:44px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{display:flex;width:100%;max-width:720px;margin:0 auto}
.tabs button{flex:1;background:none;border:0;padding:11px 2px 10px;font-size:13px;font-weight:600;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
</style>
</head>

  ['N10','Circuito de abdomen: crunch 15 + elevación de piernas 15 + plancha 30 s','3 × circuito','45 s']]},
 D:{name:'Pierna completa',warm:'Péndulo de 15 repeticiones, femoral acostado de 15 con poco peso y 2 series de 20 de sentadilla liviana.',ex:[
  ['D1','Sentadilla libre controlada (1 serie de aproximación + 3 pesadas)','4 × 8–12','3 min'],

  ['D3','Peso muerto rumano con barra','3 × 8–12','2 min'],

function target(){var t=state.targets||{};return {k:t.k||2100,p:t.p||180,c:t.c||200,f:t.f||65}}
function protTotal(date){return (day(date).prot||0)+mealTotals(date).p}
function syncProt(date){day(date).chk.prot=protTotal(date)>=target().p}
function mealsChanged(date,key){
  var d=day(date);if(key&&key!=='ot'&&(d.meals[key]||[]).length)d.chk[key]=true;
  syncProt(date);save();
}
function catKey(f){return f?CATK[f.g]||'g':'g'}
function catGrams(items){var t={p:0,c:0,v:0,f:0,g:0};(items||[]).forEach(function(it){var f=foodBy(it.f);if(f)t[catKey(f)]+=num(it.g)});return t}
function mealBalanceHtml(key,items){
  if(!items||!items.length)return '';
  var g=catGrams(items),core=g.p+g.c+g.v,main=(key==='lu'||key==='di');
  var bar=core>0?'<div class="stackbar">'+['p','c','v'].map(function(k){return g[k]>0?'<i style="width:'+(100*g[k]/core)+'%;background:var(--c'+k+')"></i>':''}).join('')+'</div>':'';
  var chips='<div class="bchips">'+['p','c','v'].map(function(k){var has=g[k]>0;return '<span class="bchip'+(has?' ok':'')+'"><i style="background:var(--c'+k+')"></i>'+CATL[k]+' '+(has?r0(g[k])+' g':'—')+'</span>'}).join('')+'</div>';
  var ex=[];if(g.f>0)ex.push('fruta '+r0(g.f)+' g');if(g.g>0)ex.push('grasas y extras '+r0(g.g)+' g');
  var tip='';
  if(main){var miss=[];if(g.p<=0)miss.push('una proteína');if(g.c<=0)miss.push('un carbohidrato');if(g.v<100)miss.push('vegetales (unos 100 a 150 g)');if(miss.length)tip='<div class="small" style="margin-top:6px"><b>Te falta:</b> '+miss.join(', ')+'.</div>'}
  return bar+chips+(ex.length?'<div class="small muted" style="margin-top:4px">Además: '+ex.join(' · ')+'.</div>':'')+tip;
}
function dayBalanceHtml(date){
  var ms=dayMeals(date),all=[];MEALS.forEach(function(m){all=all.concat(ms[m[0]])});
  if(!all.length)return '<div class="eyebrow">Equilibrio del día</div><p class="small muted" style="margin:0">Cuando agregues alimentos verás aquí cuánto de cada tipo llevas.</p>';
  var g=catGrams(all),fv=g.v+g.f,core=g.p+g.c+g.v;
  return '<div class="eyebrow">Equilibrio del día (por peso)</div>'+
   (core>0?'<div class="stackbar">'+['p','c','v'].map(function(k){return g[k]>0?'<i style="width:'+(100*g[k]/core)+'%;background:var(--c'+k+')"></i>':''}).join('')+'</div>':'')+
   '<div class="bchips">'+['p','c','v','f','g'].map(function(k){return '<span class="bchip'+(g[k]>0?' ok':'')+'"><i style="background:var(--c'+k+')"></i>'+CATL[k]+' '+r0(g[k])+' g</span>'}).join('')+'</div>'+
   macroBar('Frutas y vegetales',fv,400,' g')+
   '<p class="small muted" style="margin:0">Método del plato (visual): la mitad vegetales, un cuarto proteína y un cuarto carbohidrato. Aquí ves tus proporciones por peso.</p>'+dayAnalysisHtml(date);
}
function foodTotalsHtml(date){
  var T=target(),t=mealTotals(date),left=Math.max(0,T.p-protTotal(date));
  return '<div class="row between"><div class="eyebrow">Total del día</div><b class="score" style="font-size:30px">'+r0(t.k)+' <span class="muted" style="font-size:16px">/ '+T.k+' kcal</span></b></div>'+
   macroBar('Proteína',protTotal(date),T.p,' g')+macroBar('Carbohidratos',t.c,T.c,' g')+macroBar('Grasa',t.f,T.f,' g')+
   '<p class="small" style="margin:0">'+(left>0?'Te faltan <b>'+r0(left)+' g de proteína</b> para tu meta.':'Meta de proteína cumplida.')+'</p>';
}
function refreshFoodNumbers(date){
  var ms=dayMeals(date);
  MEALS.forEach(function(m){
    var items=ms[m[0]],tot=sumMac(items),h=document.getElementById('mh-'+m[0]);
    if(h)h.textContent=r0(tot.k)+' kcal · '+r0(tot.p)+' g P';
    items.forEach(function(it,i){var e=document.getElementById('mi-'+m[0]+'-'+i);if(e){e.textContent=itemLine(it)}});
    var b=document.getElementById('mb-'+m[0]);if(b)b.innerHTML=mealBlock(m[0],items);
  });
  var t=document.getElementById('ftot');if(t)t.innerHTML=foodTotalsHtml(date);
  var bd=document.getElementById('fbal');if(bd)bd.innerHTML=dayBalanceHtml(date);
}
var SHARE={bk:0.21,lu:0.29,sn:0.22,di:0.28};
var TOL={p:[0.8,1.25],c:[0.7,1.3],f:[0.6,1.4]};
var r5=function(n){return Math.max(5,Math.round(n/5)*5)};
var rh=function(n){return Math.max(0.5,Math.round(n*2)/2)};
function mealTarget(key){var sh=SHARE[key];if(!sh)return null;var T=target();return {k:T.k*sh,p:T.p*sh,c:T.c*sh,f:T.f*sh}}
function gapIdeas(kind,gap,key){
  var light=(key==='bk'||key==='sn');
  if(kind==='p')return light?[rh(gap/6.3)+' huevos',rh(gap/24)+' scoop de whey',r5(gap/0.09)+' g de yogur griego']:[r5(gap/0.23)+' g de pechuga de pollo (cruda)',rh(gap/6.3)+' huevos',r5(gap/0.25)+' g de atún'];
  if(kind==='c')return light?[r5(gap/0.67)+' g de avena en hojuelas',rh(gap/11.5)+' tajadas de pan integral',rh(gap/27)+' bananos']:[r5(gap/0.28)+' g de arroz cocido',r5(gap/0.2)+' g de papa cocida',r5(gap/0.31)+' g de plátano cocido'];
  return light?[r5(gap/0.5)+' g de almendras',rh(gap/8)+' cucharada de mantequilla de maní']:[rh(gap/13)+' cucharada de aceite de oliva',r5(gap/0.147)+' g de aguacate'];
}
function excessIdea(kind,ex){
  if(kind==='p')return 'baja unos '+r5(ex/0.23)+' g de pollo crudo o una porción de proteína';
  if(kind==='c')return 'baja unos '+r5(ex/0.28)+' g de arroz cocido o de papa';
  return 'usa '+rh(ex/13)+' cucharada menos de aceite o quita unos '+r5(ex/0.147)+' g de aguacate';
}
function qtyTxt(food,g){
  var u=pref(food.id);
  if(!u)return r5(g)+' g';
  var n=u.ug<5?Math.max(1,Math.round(g/u.ug)):rh(g/u.ug);
  return n+' '+(n===1?u.s:u.p);
}
function excessFrom(items,kind,ex){
  items=items||[];
  if(kind==='f'){
    var parts=[],left=ex;
    items.map(function(it){var f=foodBy(it.f);return {it:it,f:f}}).filter(function(x){return x.f&&x.f.g==='Grasas y extras'&&x.f.f>0}).sort(function(a,b){return b.f.f*num(b.it.g)-a.f.f*num(a.it.g)}).forEach(function(x){
      if(left<=0)return;
      var fv=x.f.f*num(x.it.g)/100,cut=Math.min(fv,left),gcut=cut/(x.f.f/100);
      var uu=pref(x.f.id),self=uu&&/^(huevo|clara|almendra|nuez|kiwi|manzana|banano|galleta|arepa)$/.test(uu.s);
      parts.push((cut>=fv-0.5?'quita ':'baja ')+qtyTxt(x.f,cut>=fv-0.5?num(x.it.g):gcut)+(self?'':' de '+x.f.n.toLowerCase()));
      left-=cut;
    });
    if(left>1){
      var egg=items.filter(function(it){return it.f==='huevo'})[0];
      if(egg){var n=Math.min(Math.round(num(egg.g)/50),Math.ceil(left/4.7));if(n>0)parts.push('cambia '+n+' huevo'+(n>1?'s':'')+' entero'+(n>1?'s':'')+' por claras')}
    }
    if(parts.length)return parts.join(' y ');
  }
  var best=null,bv=0;
  items.forEach(function(it){var f=foodBy(it.f);if(!f)return;var v=f[kind]*num(it.g)/100;if(v>bv){bv=v;best=it}});
  if(!best)return excessIdea(kind,ex);
  var f=foodBy(best.f),need=Math.min(num(best.g),ex/(f[kind]/100));
  return 'el mayor aporte viene de '+f.n.replace(/ \(.*\)/,'').toLowerCase()+': baja unos '+qtyTxt(f,need);
}
var MNAME={p:'Proteína',c:'Carbohidrato',f:'Grasa'};
function mealAnalysisHtml(key,items){
  var tg=mealTarget(key);if(!tg||!items||!items.length)return '';
  var t=sumMac(items),g=catGrams(items),rows='',bad=0,main=(key==='lu'||key==='di');
  ['p','c','f'].forEach(function(k){
    var v=t[k],tv=tg[k],r=tv>0?v/tv:1,lo=TOL[k][0],hi=TOL[k][1],ok=r>=lo&&r<=hi,msg='';
    if(!ok){bad++;msg=r<lo?'Te faltan ~'+r0(tv-v)+' g. Por ejemplo: '+gapIdeas(k,tv-v,key).slice(0,2).join(' o ')+'.':'Te pasas ~'+r0(v-tv)+' g: '+excessFrom(items,k,v-tv)+'.'}
    rows+='<div class="anr"><span>'+MNAME[k]+'</span><b>'+r0(v)+' / ~'+r0(tv)+' g <span class="'+(ok?'okc':'warnc')+'">'+(ok?'✓':(r<lo?'↓':'↑'))+'</span></b></div>'+(msg?'<div class="small" style="margin-top:2px">'+msg+'</div>':'');
  });
  if(main){var okv=g.v>=100;if(!okv)bad++;rows+='<div class="anr"><span>Vegetales</span><b>'+r0(g.v)+' / ~100–150 g <span class="'+(okv?'okc':'warnc')+'">'+(okv?'✓':'↓')+'</span></b></div>'+(okv?'':'<div class="small" style="margin-top:2px">Agrega unos 100 a 150 g de ensalada o verduras.</div>')}
  rows+='<div class="small muted" style="margin-top:8px">Esta comida pesa ~'+r0(t.k)+' kcal frente a una meta de ~'+r0(tg.k)+' kcal (el '+Math.round(SHARE[key]*100)+' % de tu día).</div>';
  return '<details class="an" data-ank="'+key+'"'+(fb.an[key]?' open':'')+'><summary><span>Balance del plato · <b class="'+(bad?'warnc':'okc')+'">'+(bad?bad+' cosa'+(bad>1?'s':'')+' por ajustar':'balanceado')+'</b></span></summary><div style="margin-top:6px">'+rows+'</div></details>';
}
function mealBlock(key,items){return mealBalanceHtml(key,items)+mealAnalysisHtml(key,items)}
function dayAnalysisHtml(date){
  var T=target(),t=mealTotals(date),P=protTotal(date),rows='',any=false;
  var ms=dayMeals(date),allItems=[];MEALS.forEach(function(m){if((ms[m[0]]||[]).length)any=true;allItems=allItems.concat(ms[m[0]]||[])});
  if(!any)return '';
  [['p','Proteína',P,T.p,[0.9,1.15]],['c','Carbohidratos',t.c,T.c,[0.8,1.2]],['f','Grasa',t.f,T.f,[0.8,1.2]]].forEach(function(x){
    var r=x[2]/x[3],ok=r>=x[4][0]&&r<=x[4][1];
    rows+='<div class="anr"><span>'+x[1]+'</span><b>'+r0(x[2])+' / '+r0(x[3])+' g <span class="'+(ok?'okc':'warnc')+'">'+(ok?'✓':(r<x[4][0]?'↓':'↑'))+'</span></b></div>';
    if(!ok)rows+='<div class="small" style="margin-top:2px">'+(r<x[4][0]?'Te faltan ~'+r0(x[3]-x[2])+' g. Ejemplo: '+gapIdeas(x[0],x[3]-x[2]).slice(0,2).join(' o ')+'.':'Te pasas ~'+r0(x[2]-x[3])+' g: '+excessFrom(allItems,x[0],x[2]-x[3])+'.')+'</div>';
  });
  var rk=t.k/T.k,okk=rk>=0.9&&rk<=1.1;
  rows+='<div class="anr"><span>Calorías</span><b>'+r0(t.k)+' / '+T.k+' <span class="'+(okk?'okc':'warnc')+'">'+(okk?'✓':(rk<0.9?'↓':'↑'))+'</span></b></div>';
  return '<div class="eyebrow" style="margin-top:12px">¿Vas balanceado hoy?</div>'+rows;
}
function macroBar(lbl,v,tg,unit){var pct=Math.min(100,Math.round(100*v/tg));return '<div><div class="row between"><span class="small muted">'+lbl+'</span><b class="small">'+r0(v)+' / '+tg+unit+'</b></div><div class="bar'+(lbl==='Proteína'&&v>=tg?' ok':'')+'"><i style="width:'+pct+'%"></i></div></div>'}
function foodRow(f){return '<button class="frow" data-fpick="'+f.id+'"><span><b>'+esc(f.n)+(f.mine?' <span class="tag">mío</span>':'')+'</b><span class="small muted" style="display:block">por 100 g: '+r0(f.k)+' kcal · '+r1(f.p)+' g P · '+r1(f.c)+' g C · '+r1(f.f)+' g G</span></span><span class="muted">›</span></button>'}

  var q=fb.q.trim().toLowerCase(),all=allFoods();
  if(q){
    var r=all.filter(function(f){return f.n.toLowerCase().indexOf(q)>=0});
    return r.length?r.map(foodRow).join(''):'<p class="muted small" style="margin:8px 0">No hay coincidencias. Puedes crear tu propio alimento.</p>';
  }

    return '<details class="fgrp" data-fgd="'+esc(g)+'"'+(fb.open[g]?' open':'')+'><summary><span><span class="dotc" style="background:var(--c'+CATK[g]+')"></span>'+esc(g)+' <span class="small muted">('+a.length+')</span></span></summary>'+a.map(foodRow).join('')+'</details>';
  }).join('');
}

function mealCard(date,key,label,items){
  var tot=sumMac(items),h='<div class="card" style="margin-top:12px" id="meal-'+key+'"><div class="row between"><h3>'+label+'</h3><span class="small muted" id="mh-'+key+'">'+r0(tot.k)+' kcal · '+r0(tot.p)+' g P</span></div>';
  var mt=mealTarget(key);
  if(mt)h+='<div class="small muted" id="mt-'+key+'">Meta de esta comida: ≈ '+r0(mt.k)+' kcal · '+r0(mt.p)+' g P · '+r0(mt.c)+' g C · '+r0(mt.f)+' g G · estructura: 1 proteína + 1 carbohidrato + vegetales</div>';
  if(!items.length)h+='<p class="muted small" style="margin:6px 0 0">Sin alimentos todavía.</p>';
  items.forEach(function(it,i){
    var f=foodBy(it.f),m=itemMac(it),ck=catKey(f);
    var un=f?pref(f.id):null,nn=un?unitsFor(it):null;
    h+='<div class="fi"><div class="fin"><b><span class="dotc" style="background:var(--c'+ck+')"></span>'+esc(f?f.n:'(alimento eliminado)')+'</b><span class="small muted" id="mi-'+key+'-'+i+'">'+itemLine(it)+'</span></div>'+
     '<div class="figr">'+(un?'<input type="number" inputmode="decimal" step="'+un.st+'" class="fg" data-fg="'+key+'|'+i+'" data-ug="'+un.ug+'" value="'+nn+'" aria-label="Cantidad de '+esc(f.n)+' en '+un.p+'"><span class="small muted ul" style="min-width:64px">'+unitLbl(un,nn)+'</span>':'<input type="number" inputmode="decimal" class="fg" data-fg="'+key+'|'+i+'" value="'+esc(it.g)+'" aria-label="Gramos de '+esc(f?f.n:'alimento')+'"><span class="small muted" style="min-width:64px">g</span>')+'<button class="xbtn" data-fdel="'+key+'|'+i+'" aria-label="Quitar alimento">✕</button></div></div>';
  });
  h+='<div id="mb-'+key+'">'+mealBlock(key,items)+'</div>';
  h+='<div class="row" style="flex-wrap:wrap;margin-top:10px"><button class="btn" data-fadd="'+key+'">+ Alimento</button><button class="btn ghost" data-fplates="'+key+'">Platos</button>'+(items.length?'<button class="btn ghost" data-fsave="'+key+'">Guardar como plato</button>':'')+'</div>';
  if(fb.meal===key&&fb.mode)h+='<div id="picker">'+pickerHtml(key)+'</div>';
  return h+'</div>';

function foodRulesFromCoach(){

document.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.fg!==undefined){var qf=el.dataset.fg.split('|'),itf=dayMeals(cur)[qf[0]][+qf[1]];if(itf){var ugf=+el.dataset.ug||1;itf.g=Math.max(0,Math.round(num(el.value)*ugf*10)/10);var uu=pref(itf.f),lb=el.parentNode.querySelector('.ul');if(uu&&lb)lb.textContent=unitLbl(uu,num(el.value));syncProt(cur);save();refreshFoodNumbers(cur)}return}
  if(el.id==='fq'){fb.q=el.value;var fr=document.getElementById('fres');if(fr)fr.innerHTML=resultsHtml();return}
  if(el.id==='fui'){var uI=pref(fb.sel);if(uI){fb.g=Math.round(num(el.value)*uI.ug*10)/10;var ug4=document.getElementById('fugr');if(ug4)ug4.textContent='= '+r0(fb.g)+' g';var pv6=document.getElementById('fprev');if(pv6)pv6.textContent=previewHtml()}return}
  if(el.id==='fgi'){fb.g=el.value;var pv3=document.getElementById('fprev');if(pv3)pv3.textContent=previewHtml();return}
  if(el.id==='fpn'){fb.name=el.value;return}
  if(el.id==='bw'){day(cur).bw=el.value===''?'':parseFloat(el.value);save()}
  else if(el.dataset.wknote){state.weeks=state.weeks||{};state.weeks[el.dataset.wknote]=el.value;save()}
  else if(el.id==='steps'){day(cur).steps=parseInt(el.value,10)||0;save();updateTop()}
  else if(el.id==='note'){day(cur).note=el.value;save()}
  else if(el.dataset.f){
    var e3=SESS[dayPlan(cur).kind].ex[gym.idx],s3=ensureLog(cur,e3)[+el.closest('.sc').dataset.i];
    s3[el.dataset.f]=el.value;save();carryPlaceholders();
    if(s3.done){var pb3=document.querySelector('.ftitle .prbox');if(pb3)pb3.innerHTML=prBadge(e3[0],cur)}
  }
  else if(el.dataset.exnote){var d4=day(cur);d4.exnote=d4.exnote||{};d4.exnote[el.dataset.exnote]=el.value;save()}
  else if(el.dataset.h){var q2=el.dataset.h.split('|');state.days[q2[0]].log[q2[1]][+q2[2]][q2[3]]=el.value;save();histOpen=q2[0]}
  else if(el.dataset.m){var q=el.dataset.m.split('|'),s2=state.meas[q[0]]||(state.meas[q[0]]={});
    if(q[0]==='base'&&!Object.keys(s2).length)Object.keys(BASE).forEach(function(k){s2[k]=BASE[k]});
    s2[q[1]]=el.value===''?null:parseFloat(el.value);save();pendingRender=true}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.fg!==undefined){var q2=t.dataset.fg.split('|'),it=dayMeals(cur)[q2[0]][+q2[1]];if(it){it.g=Math.max(0,Math.round(num(t.value)*(+t.dataset.ug||1)*10)/10);mealsChanged(cur,'');render()}return}
  if(t.dataset&&t.dataset.tg!==undefined){state.targets=state.targets||target();state.targets[t.dataset.tg]=num(t.value)||state.targets[t.dataset.tg];save();render();return}
  if(ev.target.id==='pexsel'){pex=ev.target.value;try{localStorage.setItem(LS+'-pex',pex)}catch(e){}render()}
});
document.addEventListener('toggle',function(ev){var t=ev.target;if(t&&t.classList&&t.classList.contains('an')&&t.dataset.ank){fb.an[t.dataset.ank]=t.open}if(t&&t.classList&&t.classList.contains('fgrp')&&t.dataset.fgd){fb.open[t.dataset.fgd]=t.open}},true);
document.addEventListener('focusout',function(){setTimeout(function(){
  var a=document.activeElement;
  if(pendingRender&&!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'))){pendingRender=false;render()}
},0)});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){if(tInt)tick();var a=document.activeElement;if(!(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')))render()}});

render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
